basePath: /
definitions:
  models.RegisterRequest:
    properties:
      confirmpassword:
        type: string
      email:
        type: string
      fullname:
        type: string
      password:
        type: string
      username:
        type: string
    required:
    - confirmpassword
    - email
    - fullname
    - password
    - username
    type: object
  models.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      fullname:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      profile_pic:
        type: string
      role:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@example.com
    name: API Support
    url: http://www.example.com/support
  description: API for BE-EventOrganizer
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://example.com/terms/
  title: BE Event Organizer API
  version: "1.0"
paths:
  /auth/register:
    post:
      consumes:
      - application/json
      description: Register new user. Returns only status and message (no data).
      parameters:
      - description: Register payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created (no data)
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties: true
            type: object
      summary: Register a new user
      tags:
      - Auth
  /user/me:
    get:
      consumes:
      - application/json
      description: Return profile of the current logged-in user (no password).
      produces:
      - application/json
      responses:
        "200":
          description: user profile (password hidden by json:\"-\")
          schema:
            $ref: '#/definitions/models.User'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Server error
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      summary: Get logged-in user profile
      tags:
      - User
swagger: "2.0"
